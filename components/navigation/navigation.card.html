<!-- @dsCard group="Components" viewport="700x200" name="Segmented control & bottom nav" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"></head>
<body style="margin:0;background:var(--cp-bg-page)"><div id="root"></div>
<script type="text/x-cp">
const Frame = ({ children, dir = 'ltr', cap }) => (
  <div dir={dir} style={{ width: '322px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
    {cap && <span dir="ltr" style={{ fontSize: '11px', color: 'var(--cp-text-secondary)' }}>{cap}</span>}
    {children}
  </div>
);
function Demo() {
  const [seg, setSeg] = React.useState('a');
  const [nav, setNav] = React.useState('home');
  return (
  <div style={{ display: 'flex', gap: '16px', padding: '16px', alignItems: 'flex-start' }}>

    <Frame cap="SegmentedControl">
      <SegmentedControl value={seg} onChange={setSeg} options={[{ value: 'a', label: 'Schedule' }, { value: 'b', label: 'Statements' }]} />
      <div dir="rtl"><SegmentedControl size="sm" value={seg} onChange={setSeg} options={[{ value: 'a', label: 'الجدول' }, { value: 'b', label: 'الكشوفات' }]} /></div>
    </Frame>
    <Frame cap="BottomNav — tap to switch">
      <BottomNav value={nav} onChange={setNav} items={[{ key: 'home', icon: 'house', label: 'Home' }, { key: 'loan', icon: 'landmark', label: 'Loan' }, { key: 'pay', icon: 'credit-card', label: 'Payments' }, { key: 'me', icon: 'user', label: 'Profile' }]} />
    </Frame>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
<script src="../../components/_preview.js"></script>
</body></html>
