<!-- @dsCard group="App" viewport="760x900" name="Active loan home" subtitle="Push notification → app: EN/AR, on-track/overdue" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearPath · Active loan</title>
<link rel="stylesheet" href="../../styles.css">
</head>
<body style="margin:0;background:#e4e6e1">
<div id="root"></div>
<script>window.CP_EXTRA = ['LockScreen.jsx', 'OfferScreen.jsx', 'HomeScreen.jsx'];</script>
<script type="text/x-cp">
function Seg({ value, options, onChange }) {
  return (
    <SegmentedControl size="sm" value={value} onChange={onChange} options={options.map(([v, l]) => ({ value: v, label: l }))} />
  );
}
function App() {
  const saved = JSON.parse(localStorage.getItem('cp-kit') || '{}');
  const [lang, setLang] = React.useState(saved.lang || 'en');
  const [loanState, setLoanState] = React.useState(saved.loanState || 'on-track');
  const [screen, setScreen] = React.useState('lock');
  const [fromPush, setFromPush] = React.useState(false);
  const [run, setRun] = React.useState(0);
  const [data, setData] = React.useState('full');
  const [sim, setSim] = React.useState('none');
  const go = (s) => { setScreen(s); setFromPush(false); setRun((r) => r + 1); };
  React.useEffect(() => localStorage.setItem('cp-kit', JSON.stringify({ lang, loanState })), [lang, loanState]);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '20px', padding: '28px 16px 48px' }}>
      <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap', justifyContent: 'center' }}>
        <Seg value={lang} onChange={setLang} options={[['en', 'English'], ['ar', 'العربية']]} />
        <Seg value={screen} onChange={go} options={[['lock', 'Push notification'], ['app', 'App']]} />
        <Seg value={loanState} onChange={setLoanState} options={[['on-track', 'On track'], ['overdue', 'Overdue']]} />
        <label style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', height: '44px', padding: '0 6px 0 16px', borderRadius: '999px', background: '#fff', boxShadow: 'var(--cp-shadow-card)', fontFamily: 'var(--cp-font-text)', fontSize: '13.5px', color: 'var(--cp-text-secondary)' }}>Simulate
          <select value={sim} onChange={(e) => { setSim(e.target.value); setScreen('app'); setRun((r) => r + 1); }} style={{ height: '34px', border: 'none', borderRadius: '999px', background: 'var(--cp-bg-sunken)', padding: '0 12px', fontFamily: 'inherit', fontSize: '13.5px', fontWeight: 500, color: 'var(--cp-text-primary)' }}>
            {[['none', 'No errors'], ['payfail', 'Payment fails'], ['timeout', 'Payment pending'], ['offline', 'Offline'], ['session', 'Session expired'], ['server', 'Server error'], ['quote', 'Quote expired']].map(([v, l]) => <option key={v} value={v}>{l}</option>)}
          </select>
        </label>
        <Seg value={data} onChange={(v) => { setData(v); setScreen('app'); setRun((r) => r + 1); }} options={[['full', 'Active loan'], ['empty', 'New account']]} />
      </div>
      <div id="cp-phone" style={{ position: 'relative', width: '390px', height: '844px', maxWidth: '100%', borderRadius: '48px', border: '10px solid #16181d', overflow: 'hidden', background: 'var(--cp-bg-page)', boxShadow: '0 20px 50px rgba(0,0,0,.18)' }}>
        {screen === 'app' && sim === 'session' ? (
          <div dir={lang === 'ar' ? 'rtl' : 'ltr'} style={{ height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '0 20px', background: 'var(--cp-bg-page)' }}>
            <ErrorState tone="info" icon="lock" title={lang === 'ar' ? 'انتهت جلستك' : 'Your session has ended'} actionLabel={lang === 'ar' ? 'تسجيل الدخول بـ Face ID' : 'Log in with Face ID'} actionIcon="scan-face" onAction={() => { setSim('none'); setRun((r) => r + 1); }} secondaryLabel={lang === 'ar' ? 'استخدم رمز المرور' : 'Use passcode'}>{lang === 'ar' ? 'لحمايتك، سجّلنا خروجك بعد فترة من عدم النشاط. بياناتك لم تتغير.' : 'For your security, we signed you out after a period of inactivity. Nothing on your loan has changed.'}</ErrorState>
          </div>
        ) : screen === 'lock' ? (
          <LockScreen key={'l' + run + lang} lang={lang} onOpen={() => { setScreen('app'); setFromPush(true); }} />
        ) : (
          <div id="cp-scroll" style={{ height: '100%', overflowY: 'auto' }}>
            <HomeScreen key={'h' + run + data} lang={lang} loanState={loanState} openOfferOnMount={fromPush && data === 'full'} empty={data === 'empty'} sim={sim} />
          </div>
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="../../components/_preview.js"></script>
</body>
</html>
